<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>Doktor Kripta v3.7 — Binance Sync</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { dark: { 900:'#050914',800:'#0a0f1a',700:'#111827',600:'#1a2332' } } } } }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  body{font-family:'Inter',system-ui,sans-serif}
  .card{background:rgba(17,24,39,.92);border:1px solid #1e293b;border-radius:16px}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700}
</style>
</head>
<body class="bg-dark-900 text-white min-h-screen">
<header class="sticky top-0 z-50 bg-dark-800/95 backdrop-blur border-b border-slate-800 px-4 py-3">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-sky-500 flex items-center justify-center text-xl font-black">🩺</div>
      <div>
        <h1 class="text-lg font-black">Doktor Kripta <span class="text-emerald-400">v3.7</span></h1>
        <p class="text-xs text-slate-400">Binance 15m · Sync s botom</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="loadAll()" id="btnAnalyze" class="px-3 py-2 rounded-xl bg-emerald-500 text-dark-900 font-bold text-sm">⚡ Analiziraj</button>
      <button onclick="toggleAuto()" id="btnAuto" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold">🔄 Auto ON</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-3 py-4 space-y-4">
  <div class="card p-4">
    <div class="flex justify-between mb-2">
      <h2 class="font-bold">🩺 Dijagnoza (Binance 15m)</h2>
      <span id="statusPill" class="pill bg-emerald-900/40 text-emerald-300">gotovo</span>
    </div>
    <p id="mainDiag" class="text-sm text-slate-300 mb-3">Učitavanje...</p>

    <!-- TOP 5 -->
    <div class="bg-dark-900 rounded-xl p-3 mb-3">
      <div class="text-xs text-slate-500 uppercase mb-2 font-bold">🏆 Top 5 predviđenih skokova</div>
      <div id="top5" class="space-y-1.5 text-sm"></div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="bg-dark-900 rounded-xl p-2.5 text-center"><div class="text-[10px] text-slate-500">MIN→MAX</div><div id="statBuy" class="text-2xl font-black text-emerald-400">0</div></div>
      <div class="bg-dark-900 rounded-xl p-2.5 text-center"><div class="text-[10px] text-slate-500">MAX→MIN</div><div id="statSell" class="text-2xl font-black text-red-400">0</div></div>
      <div class="bg-dark-900 rounded-xl p-2.5 text-center"><div class="text-[10px] text-slate-500">Najbolji</div><div id="statBest" class="text-lg font-black text-sky-400">—</div></div>
      <div class="bg-dark-900 rounded-xl p-2.5 text-center"><div class="text-[10px] text-slate-500">Zadnje</div><div id="statTime" class="text-lg font-black">—</div></div>
    </div>
  </div>

  <div class="flex gap-2">
    <select id="filterSig" onchange="renderList()" class="bg-dark-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm">
      <option value="all">Svi</option>
      <option value="MIN→MAX">MIN → MAX</option>
      <option value="MAX→MIN">MAX → MIN</option>
    </select>
    <input id="searchCoin" type="text" placeholder="Traži…" oninput="renderList()" class="bg-dark-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm w-28">
  </div>

  <div id="coinList" class="space-y-3"></div>
</main>

<script>
const PAIRS = [
  {sym:'BTC', binance:'BTCUSDT'},
  {sym:'ETH', binance:'ETHUSDT'},
  {sym:'SOL', binance:'SOLUSDT'},
  {sym:'SUI', binance:'SUIUSDT'},
  {sym:'AVAX', binance:'AVAXUSDT'},
  {sym:'LINK', binance:'LINKUSDT'},
  {sym:'NEAR', binance:'NEARUSDT'},
  {sym:'ADA', binance:'ADAUSDT'},
  {sym:'DOGE', binance:'DOGEUSDT'},
  {sym:'XRP', binance:'XRPUSDT'},
  {sym:'BNB', binance:'BNBUSDT'},
  {sym:'DOT', binance:'DOTUSDT'},
  {sym:'ARB', binance:'ARBUSDT'},
  {sym:'OP', binance:'OPUSDT'},
  {sym:'INJ', binance:'INJUSDT'},
  {sym:'APT', binance:'APTUSDT'},
  {sym:'FET', binance:'FETUSDT'},
  {sym:'HBAR', binance:'HBARUSDT'},
  {sym:'PEPE', binance:'PEPEUSDT'},
  {sym:'RENDER', binance:'RENDERUSDT'},
];

let coins = [];
let autoTimer = null;

function sma(a,n){ if(!a||a.length<n)return null; return a.slice(-n).reduce((x,y)=>x+y,0)/n; }
function atr(prices,n=14){
  if(!prices||prices.length<n+1)return null;
  const trs=[];
  for(let i=1;i<prices.length;i++){
    const h=l=prices[i], prev=prices[i-1];
    trs.push(Math.max(h-l, Math.abs(h-prev), Math.abs(l-prev)));
  }
  return sma(trs.slice(-n),n);
}

function analyze(closes, price){
  if(!closes||closes.length<20||price<=0){
    return {order:'NEPOZNATO', predMin:price*0.997, predMax:price*1.003, reason:'Nedovoljno', jumpPct:0};
  }
  const last = price;
  const recent = closes.slice(-8);
  const rHigh = Math.max(...recent), rLow = Math.min(...recent);
  const rangeR = rHigh-rLow || last*0.008;
  const pos = (last-rLow)/rangeR;
  const micro = closes.length>=3 ? ((last-closes[closes.length-3])/closes[closes.length-3])*100 : 0;
  const atrVal = atr(closes)||last*0.008;
  const predMin = last - atrVal*0.9;
  const predMax = last + atrVal*0.9;
  const jumpPct = (predMax-last)/last*100;

  let order, reason;
  if(micro>0.3 && pos<0.65){ order='MAX → MIN'; reason=`Momentum gore (+${micro.toFixed(2)}%)`; }
  else if(micro<-0.3 && pos>0.35){ order='MIN → MAX'; reason=`Momentum dolje (${micro.toFixed(2)}%)`; }
  else if(pos>0.78){ order='MIN → MAX'; reason='Cijena blizu vrha'; }
  else if(pos<0.22){ order='MAX → MIN'; reason='Cijena blizu dna'; }
  else {
    const lm = closes[closes.length-1]-closes[closes.length-2];
    order = lm>=0 ? 'MAX → MIN' : 'MIN → MAX';
    reason = lm>=0 ? 'Zadnji candle zeleni' : 'Zadnji candle crveni';
  }
  return {order, reason, predMin, predMax, jumpPct, atr:atrVal};
}

function fmtP(p){
  if(p==null||isNaN(p))return'n/a';
  if(p<0.0001)return '$'+p.toPrecision(4);
  if(p<0.01)return '$'+p.toPrecision(4);
  if(p<1)return '$'+p.toFixed(4);
  if(p<100)return '$'+p.toFixed(3);
  return '$'+p.toFixed(2);
}

async function fetchKlines(symbol){
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=50`;
  const res = await fetch(url);
  if(!res.ok) return null;
  const data = await res.json();
  return data.map(c => parseFloat(c[4])); // close
}

async function loadAll(){
  const btn=document.getElementById('btnAnalyze');
  const st=document.getElementById('statusPill');
  btn.disabled=true; btn.textContent='Učitavam…';
  st.textContent='analiza…'; st.className='pill bg-yellow-900/50 text-yellow-300';

  try{
    const results = await Promise.all(PAIRS.map(async p => {
      const closes = await fetchKlines(p.binance);
      if(!closes||closes.length<15) return null;
      const price = closes[closes.length-1];
      const a = analyze(closes, price);
      return {sym:p.sym, binance:p.binance, price, ...a};
    }));

    coins = results.filter(Boolean);
    coins.sort((a,b)=>b.jumpPct-a.jumpPct);

    const minMax = coins.filter(c=>c.order==='MIN → MAX');
    const maxMin = coins.filter(c=>c.order==='MAX → MIN');
    const best = minMax[0] || coins[0];

    // Top 5
    const top5 = minMax.slice(0,5);
    document.getElementById('top5').innerHTML = top5.length
      ? top5.map((c,i)=>`
        <div class="flex justify-between items-center ${i===0?'text-emerald-400 font-bold':''}">
          <span>${i+1}. ${c.sym}</span>
          <span class="font-black">+${c.jumpPct.toFixed(2)}%</span>
        </div>`).join('')
      : '<div class="text-slate-500">Nema MIN→MAX</div>';

    document.getElementById('statBuy').textContent = minMax.length;
    document.getElementById('statSell').textContent = maxMin.length;
    document.getElementById('statBest').textContent = best ? `${best.sym} (+${best.jumpPct.toFixed(1)}%)` : '—';
    document.getElementById('statTime').textContent = new Date().toLocaleTimeString('hr');
    document.getElementById('mainDiag').innerHTML = minMax.length
      ? `<b class="text-emerald-400">${minMax.length}× MIN→MAX</b> (Binance). Najveći: <b>${best.sym}</b> +${best.jumpPct.toFixed(2)}%`
      : 'Nema jakih MIN→MAX na Binanceu.';

    st.textContent='gotovo'; st.className='pill bg-emerald-900/40 text-emerald-300';
    renderList();
  }catch(e){
    document.getElementById('mainDiag').textContent = 'Greška: '+e.message;
    st.textContent='greška'; st.className='pill bg-red-900/40 text-red-300';
  }
  btn.disabled=false; btn.textContent='⚡ Analiziraj';
}

function renderList(){
  const f=document.getElementById('filterSig').value;
  const q=(document.getElementById('searchCoin').value||'').toUpperCase();
  let list=coins.slice();
  if(f==='MIN→MAX') list=list.filter(c=>c.order==='MIN → MAX');
  if(f==='MAX→MIN') list=list.filter(c=>c.order==='MAX → MIN');
  if(q) list=list.filter(c=>c.sym.includes(q));

  document.getElementById('coinList').innerHTML = list.map(c=>{
    const oc = c.order==='MIN → MAX' ? 'bg-emerald-900/60 text-emerald-300' : 'bg-red-900/60 text-red-300';
    return `<div class="card p-3">
      <div class="flex justify-between">
        <div>
          <div class="font-black text-lg">${c.sym}</div>
          <div class="text-xs text-slate-400">${c.reason}</div>
        </div>
        <div class="text-right">
          <div class="font-black">${fmtP(c.price)}</div>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-2">
        <span class="pill ${oc}">${c.order}</span>
        <span class="pill bg-sky-900/50 text-sky-300">Raspon ${fmtP(c.predMin)} – ${fmtP(c.predMax)}</span>
        <span class="pill bg-slate-800 font-bold">Skok +${c.jumpPct.toFixed(2)}%</span>
      </div>
    </div>`;
  }).join('') || '<div class="text-slate-500 text-center py-6">Nema rezultata</div>';
}

function toggleAuto(){
  const btn=document.getElementById('btnAuto');
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; btn.textContent='🔄 Auto OFF'; }
  else{ autoTimer=setInterval(loadAll, 60*1000); btn.textContent='🔄 Auto ON'; loadAll(); }
}
document.addEventListener('DOMContentLoaded', ()=>toggleAuto());
</script>
</body></html>
